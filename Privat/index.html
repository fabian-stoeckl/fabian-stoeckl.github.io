<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Privat</title>
<style>
:root{--bg:#f6f7fb;--text:#111827;--muted:#6b7280}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:48px 24px 70px}h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.04em;margin:0 0 10px}.sub{color:var(--muted);margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}
.tile{aspect-ratio:1/1;background:#fff;border:8px solid var(--c);border-radius:26px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);font-weight:800;font-size:30px;letter-spacing:-.03em;box-shadow:0 10px 28px rgba(31,41,55,.08);transition:.18s transform,.18s box-shadow}
.tile:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(31,41,55,.12)}
.note{margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="wrap">
<h1>Privat</h1>
<div class="sub">Persönliche Übersichten und Tools.</div>
<section class="grid">
<a class="tile" href="./ETFs/" style="--c:#5b8cff">ETF</a>
</section>
<div class="note">Weitere Themen können später einfach als zusätzliche Kacheln ergänzt werden.</div>
</main>
</body>
</html>
