<body><div class="blob1"></div><div class="blob2"></div><main class="panel"><div class="rings" aria-hidden="true">♡ ♡</div><h1>Danke für eure<br>Rückmeldung!</h1><p>Eure Angaben wurden an uns übermittelt. Wir freuen uns, von euch zu hören!</p><p>Wenn ihr später etwas ändern möchtet, könnt ihr die Rückmeldung auf derselben Seite erneut absenden.</p><a href="/Hochzeit/#rueckmeldung">Zurück zur Gästerückmeldung ↗</a><p class="small">Fabian & Melanie · 14. August 2027</p></main></body></html>
