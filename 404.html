<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seite nicht gefunden</title>
<meta name="robots" content="noindex">
<script>
// Only the general private dashboard and ETF capitalization aliases are
// retained. The sole newspaper uses its canonical direct URL, with no
// fallback route, old-folder proxy or auto-redirect.
const path = window.location.pathname.toLowerCase().replace(/\/+$/, "");
const routes = {
  "/privat": "/Privat/",
  "/privat/etfs": "/Privat/ETFs/",
};
const target = routes[path];
if (target && window.location.pathname !== target) {
  window.location.replace(target + window.location.search + window.location.hash);
}
</script>
</head>
<body>
<h1>Seite nicht gefunden</h1>
<p><a href="/">Zur Startseite</a> · <a href="/Privat/">Zur Privat-Übersicht</a> · <a href="/Privat/Persoenliche-Zeitung/">Persönliche Zeitung</a></p>
</body>
</html>
