<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seite nicht gefunden</title>
<meta name="robots" content="noindex">
<script>
// GitHub Pages is case-sensitive. Jekyll generates a current list of real
// published paths, so new Pressespiegel editions are covered automatically.
// Only case-only matches redirect; nonexistent/retired paths remain 404s.
(function () {
  'use strict';
  const publishedPaths = [
    {% for file in site.static_files %}{{ file.path | jsonify }},
    {% endfor %}
    {% for page in site.pages %}{{ page.url | jsonify }},
    {% endfor %}
  ];

  const key = path => path.toLowerCase().replace(/\/+$/, '') || '/';
  const routes = new Map();

  // Existing lowercase compatibility pages must never win over the real pages.
  function priority(path) {
    if (/^\/Privat\/(?:ETFs|Pressespiegel)\//.test(path)) return 3;
    if (/^\/(?:Privat|Hochzeit)\//.test(path)) return 2;
    return 1;
  }

  function register(path, destination, rank) {
    const lookup = key(path);
    const previous = routes.get(lookup);
    if (!previous || rank > previous.rank) {
      routes.set(lookup, { destination, rank });
    }
  }

  for (const path of publishedPaths) {
    if (typeof path !== 'string' || !path.startsWith('/')) continue;
    const rank = priority(path);
    register(path, path, rank);

    // /Privat, /PRIVAT/, /privat/INDEX.HTML etc. all find the real index.
    if (/\/index\.html$/i.test(path)) {
      const directory = path.slice(0, -'index.html'.length);
      register(directory, directory, rank + 1);
    }
  }

  const requested = window.location.pathname;
  const match = routes.get(key(requested));
  if (match && match.destination !== requested) {
    window.location.replace(match.destination + window.location.search + window.location.hash);
  }
}());
</script>
</head>
<body>
<h1>Seite nicht gefunden</h1>
<p>Bitte prüfe die Adresse. <a href="/">Zur Startseite</a> · <a href="/Privat/">Privat</a> · <a href="/Privat/Pressespiegel/">Pressespiegel</a> · <a href="/Hochzeit/">Hochzeit</a></p>
</body>
</html>
