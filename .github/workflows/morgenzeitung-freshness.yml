name: Morgenzeitung Freshness
on:
  schedule:
    # 10:15 Vienna (CEST/CET) AFTER the 08:30/09:30 ChatGPT recovery checks.
    # Two UTC slots cover DST; the pre-cutoff slot exits successfully.
    - cron: '15 8,9 * * *'
  workflow_dispatch:
    inputs:
      require_today:
        description: 'Require current Vienna date (use after daily cutoff)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/data/**'
      - '.github/workflows/morgenzeitung-freshness.yml'
      - 'scripts/check_morgenzeitung.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: morgenzeitung-freshness
  cancel-in-progress: false

jobs:
  check-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Vienna cutoff (07:45 primary and 08:30/09:30 fallbacks plus recovery grace)
        id: cutoff
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            hhmm="$(TZ=Europe/Vienna date +%H%M)"
            if [[ "$hhmm" < "1015" ]]; then
              echo "check=false" >> "$GITHUB_OUTPUT"
              echo "Not yet 10:15 Vienna ($hhmm); allow the 08:30/09:30 recovery checks to finish."
              exit 0
            fi
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"
      - name: Validate all committed editions locally
        if: steps.cutoff.outputs.check == 'true'
        run: python3 scripts/check_morgenzeitung.py
      - name: Check public HTTPS edition and date (3 attempts)
        if: steps.cutoff.outputs.check == 'true'
        env:
          REQUIRE_TODAY: ${{ github.event_name == 'schedule' || inputs.require_today == true }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if [ "$REQUIRE_TODAY" = "true" ]; then
              python3 scripts/check_morgenzeitung.py --live --require-today && exit 0
            else
              python3 scripts/check_morgenzeitung.py --live && exit 0
            fi
            echo "::warning::Morgenzeitung unavailable or stale (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::Today's Morgenzeitung missing or unreachable. The workflow checks publication but does not generate content."
          exit 1
      - name: Open or update public failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="[Morgenzeitung] Tagesausgabe fehlt"
          body="Automatische Endprüfung nach 10:15 Europe/Vienna fehlgeschlagen; die bestehenden 08:30/09:30-Ersatzläufe müssen fehlende Ausgaben produktiv fortsetzen. Zuletzt publizierten Datumsindex und Tagesausgabe prüfen: https://www.fabian-stoeckl.com/Privat/Pressespiegel/ . Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID . Der Check erstellt keine Artikel; den ChatGPT-Hauptlauf und Ersatzlauf kontrollieren."
          issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[Morgenzeitung] Tagesausgabe fehlt") | .number' | head -n1)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Close failure issue after verified recovery
        if: success() && github.event_name == 'schedule' && steps.cutoff.outputs.check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[Morgenzeitung] Tagesausgabe fehlt") | .number' | head -n1)"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Aktuelle Ausgabe am $(TZ=Europe/Vienna date +%Y-%m-%d) erfolgreich über HTTPS validiert. Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
