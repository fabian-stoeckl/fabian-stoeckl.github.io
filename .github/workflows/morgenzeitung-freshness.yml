name: Morgenzeitung Freshness
on:
  schedule:
    # UTC 08:30 = 09:30 CET / 10:30 CEST: after the 07:45 Vienna target.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      require_today:
        description: 'Require the current Vienna date (use after the daily cutoff)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/data/**'
      - '.github/workflows/morgenzeitung-freshness.yml'
      - 'scripts/check_morgenzeitung.py'

permissions:
  contents: read
concurrency:
  group: morgenzeitung-freshness
  cancel-in-progress: false
jobs:
  check-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all committed editions locally
        run: python3 scripts/check_morgenzeitung.py
      - name: Check public HTTPS edition and date
        env:
          REQUIRE_TODAY: ${{ github.event_name == 'schedule' || inputs.require_today == true }}
        run: |
          for attempt in 1 2 3; do
            if [ "$REQUIRE_TODAY" = "true" ]; then
              python3 scripts/check_morgenzeitung.py --live --require-today && exit 0
            else
              python3 scripts/check_morgenzeitung.py --live && exit 0
            fi
            echo "::warning::Morgenzeitung nicht erreichbar oder nicht aktuell (Prüfversuch $attempt/3)"
            sleep 20
          done
          echo "::error::Morgenzeitung ist nicht aktuell oder nicht erreichbar – bitte tägliche Recherche-/Veröffentlichungsaufgabe prüfen."
          exit 1
