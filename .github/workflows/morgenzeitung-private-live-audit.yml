name: Morgenzeitung private live learning audit
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Published edition date (YYYY-MM-DD); blank uses latest public edition'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/data/*.json'
  schedule:
    - cron: '15 9 * * *'
concurrency:
  group: morgenzeitung-private-live-audit
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  private-live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit real preselection evidence against published HTTPS
        env:
          GH_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
          REQUESTED_DATE: ${{ inputs.date }}
          TRIGGER_EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime, json, os, pathlib, re, subprocess, time, urllib.error, urllib.request
          token=os.environ.get('GH_TOKEN','')
          if not token:
              raise SystemExit('Missing MORGENZEITUNG_FEEDBACK_TOKEN')
          root='https://api.github.com/repos/fabian-stoeckl/morgenzeitung-feedback'
          def request(path,method='GET',body=None):
              data=json.dumps(body).encode() if body is not None else None
              req=urllib.request.Request(root+path,data=data,method=method,headers={
                  'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt==2:
                          raise
                  except (urllib.error.URLError,TimeoutError):
                      if attempt==2:
                          raise
                  time.sleep(2*(attempt+1))
          def read_private(path):
              obj=request('/contents/'+path)
              return base64.b64decode(obj['content']),obj['sha']
          date=os.environ.get('REQUESTED_DATE') or ''
          if not date and os.environ.get('TRIGGER_EVENT')=='push':
              before=os.environ.get('PUSH_BEFORE','')
              if not re.fullmatch(r'[0-9a-f]{40}',before) or before=='0'*40:
                  raise SystemExit('Cannot identify previous push commit; scheduled audit will retry')
              changed=subprocess.check_output(['git','diff','--name-only',before,os.environ['GITHUB_SHA']],text=True).splitlines()
              edition_files=[p for p in changed if re.fullmatch(r'Privat/Pressespiegel/data/\d{4}-\d{2}-\d{2}\.json',p)]
              if len(edition_files)!=1:
                  raise SystemExit('No unique published edition in push; scheduled audit will retry')
              date=pathlib.Path(edition_files[0]).stem
          if not date:
              from scripts.morgenzeitung_publication_audit import live_json
              date=live_json('index.json')['dates'][0]
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',date):
              raise SystemExit('Invalid edition date')
          # Only preselection snapshots saved by the publishing agent are acceptable.
          # Never reconstruct candidates from public output.
          candidate_path='candidates/'+date+'.json'
          profile_snapshot_path='snapshots/'+date+'-profile.json'
          issue_snapshot_path='snapshots/'+date+'-issues.json'
          parameter_path='snapshots/'+date+'-selection-parameters.json'
          required=(candidate_path,profile_snapshot_path,issue_snapshot_path,parameter_path)
          original={}
          missing=[]
          for path in required:
              try:
                  original[path]=read_private(path)
              except urllib.error.HTTPError as error:
                  if error.code!=404:raise
                  missing.append(path)
          if missing:
              from scripts.morgenzeitung_acceptance_report import missing_evidence_report
              diagnostic=missing_evidence_report(date,missing)
              print('PARTIAL:',json.dumps(diagnostic))
              dest='audits/'+date+'-missing-evidence.json'
              try:
                  existing,_=read_private(dest)
              except urllib.error.HTTPError as error:
                  if error.code!=404:raise
                  existing=None
              if existing is None:
                  try:
                      request('/contents/'+dest,'PUT',{'message':'Record incomplete learning audit',
                          'content':base64.b64encode(json.dumps(diagnostic).encode()).decode()})
                  except urllib.error.HTTPError as error:
                      if error.code not in (409,422):raise
              saved,_=read_private(dest)
              previous=json.loads(saved)
              if previous!=diagnostic:
                  # Prior immutable diagnostics remain historical; never overwrite.
                  if previous.get('date')!=date or previous.get('verdict')!='PARTIAL':
                      raise RuntimeError('Conflicting private missing-evidence diagnostic')
                  print('Previous immutable missing-evidence diagnostic preserved:',dest)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
                      summary.write('### Productive learning: PARTIAL\\nMissing originals: '+', '.join(missing)+'\\n')
              raise SystemExit('PARTIAL: original preselection evidence missing: '+', '.join(missing))
          candidates,_=original[candidate_path]
          profile,profile_blob_sha=original[profile_snapshot_path]
          issue_bytes,_=original[issue_snapshot_path]
          issues=json.loads(issue_bytes)
          parameter_bytes,_=original[parameter_path]
          parameters=json.loads(parameter_bytes)
          if set(parameters)!={'limit','max_per_source'} or type(parameters['limit']) is not int or not 1<=parameters['limit']<=15 or type(parameters['max_per_source']) is not int or parameters['max_per_source']<1:
              raise SystemExit('Invalid preselection selection parameters')

          work=pathlib.Path('/tmp/morgenzeitung-private-audit')
          work.mkdir(exist_ok=True)
          (work/'candidates.json').write_bytes(candidates)
          (work/'profile.json').write_bytes(profile)
          (work/'issues.json').write_text(json.dumps(issues))
          result_path=work/'audit.json'
          subprocess.run(['python3','-m','scripts.morgenzeitung_live_learning_gate',
              '--date',date,'--candidates',str(work/'candidates.json'),
              '--profile',str(work/'profile.json'),'--issue-versions',str(work/'issues.json'),
              '--private-output',str(result_path),
              '--limit',str(parameters['limit']),
              '--max-per-source',str(parameters['max_per_source'])],check=True)
          result=json.loads(result_path.read_text())
          # Commit chronology is necessary evidence; never infer it from file presence.
          from scripts.morgenzeitung_provenance import verify_commit_chronology
          def latest_commit(repository,path):
              url='https://api.github.com/repos/'+repository+'/commits?path='+path+'&per_page=1'
              req=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  entries=json.load(response)
              if not entries:
                  raise ValueError('No GitHub commit history for '+path)
              entry=entries[0]
              return {'sha':entry['sha'],'timestamp':entry['commit']['committer']['date']}
          try:
              private_commits={
                  'candidates':latest_commit('fabian-stoeckl/morgenzeitung-feedback',candidate_path),
                  'profile':latest_commit('fabian-stoeckl/morgenzeitung-feedback',profile_snapshot_path),
                  'issues':latest_commit('fabian-stoeckl/morgenzeitung-feedback',issue_snapshot_path),
                  'parameters':latest_commit('fabian-stoeckl/morgenzeitung-feedback',parameter_path)}
              published_commit=latest_commit('fabian-stoeckl/fabian-stoeckl.github.io',
                  'Privat/Pressespiegel/data/'+date+'.json')
              result['chronological_provenance']=verify_commit_chronology(private_commits,published_commit)
          except (ValueError,KeyError,urllib.error.HTTPError,urllib.error.URLError) as exc:
              result['chronological_provenance']={'chronology_verified':False,
                  'reason':str(exc)}
              print('PARTIAL: chronological provenance not established:',exc)
          result['private_profile_blob_sha']=profile_blob_sha
          result['candidate_snapshot_path']=candidate_path
          result['profile_snapshot_path']=profile_snapshot_path
          result['audit_code_commit']=os.environ['GITHUB_SHA']
          result['issue_snapshot_path']=issue_snapshot_path
          result['selection_parameters_snapshot_path']=parameter_path
          result['provenance_limitations']='Publication commit and S7 run persistence must be independently verified; no productive PASS inferred.'
          # A separate file avoids overwriting a genuine existing runs/YYYY-MM-DD.json.
          dest='audits/'+date+'-live-learning.json'
          encoded=base64.b64encode((json.dumps(result,ensure_ascii=False,indent=2)+chr(10)).encode()).decode()
          try:
              existing=request('/contents/'+dest)
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              existing=None
          if existing:
              old=base64.b64decode(existing['content'])
              previous=json.loads(old)
              # Two audit triggers (publication push and scheduled fallback) may
              # legitimately run different code commits. Preserve the first
              # immutable audit if the evidence and verdict are unchanged.
              stable_keys=('date','candidate_pool_sha256','profile_sha256',
                  'issue_versions','selection_parameters','selection_comparison',
                  'publication_audit','statuses','chronological_provenance')
              if any(previous.get(k)!=result.get(k) for k in stable_keys):
                  raise SystemExit('Existing private audit has different evidence; refusing overwrite: '+dest)
              result=previous
              print('Idempotent existing private audit:',dest)
          else:
              try:
                  request('/contents/'+dest,'PUT',{'message':'Archive live Morgenzeitung audit '+date,'content':encoded})
              except urllib.error.HTTPError as error:
                  if error.code not in (409,422):raise
                  saved,_=read_private(dest)
                  if json.loads(saved)!=result:raise SystemExit('Conflicting private audit content')
          saved,_=read_private(dest)
          if json.loads(saved)!=result:
              raise SystemExit('Private audit readback mismatch')
          print('Private audit saved and verified:',dest)
          print('Evidence statuses:',result['statuses'])
          from scripts.morgenzeitung_acceptance_report import acceptance
          report=acceptance(result)
          report_dest='audits/'+date+'-acceptance.json'
          report_encoded=base64.b64encode((json.dumps(report,ensure_ascii=False,indent=2) + chr(10)).encode()).decode()
          try:
              report_existing=request('/contents/'+report_dest)
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              report_existing=None
          if report_existing:
              if json.loads(base64.b64decode(report_existing['content']))!=report:
                  raise SystemExit('Existing immutable acceptance report differs: '+report_dest)
          else:
              try:
                  request('/contents/'+report_dest,'PUT',{'message':'Archive Morgenzeitung acceptance '+date,'content':report_encoded})
              except urllib.error.HTTPError as error:
                  if error.code not in (409,422):
                      raise
                  current,_=read_private(report_dest)
                  if json.loads(current)!=report:
                      raise SystemExit('Conflicting acceptance report')
          report_saved,_=read_private(report_dest)
          if json.loads(report_saved)!=report:
              raise SystemExit('Acceptance report readback mismatch')
          print('Productive acceptance:',report['verdict'],report_dest)
          PY
