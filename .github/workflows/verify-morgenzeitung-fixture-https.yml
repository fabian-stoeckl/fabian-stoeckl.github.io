name: Verify Morgenzeitung test fixture HTTPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/morgenzeitung/tests/editorial-e2e-fixture-2026-10-23.json'
      - '.github/workflows/verify-morgenzeitung-fixture-https.yml'
permissions:
  contents: read
jobs:
  check-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compare live HTTPS fixture with published repository content
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, time, urllib.error, urllib.request
          path = 'services/morgenzeitung/tests/editorial-e2e-fixture-2026-10-23.json'
          url = 'https://www.fabian-stoeckl.com/' + path
          expected = json.loads(pathlib.Path(path).read_text(encoding='utf-8'))
          assert expected['test_only'] is True and expected['not_a_daily_edition'] is True
          assert len(expected['articles']) == 3
          for attempt in range(1, 7):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Morgenzeitung-CI/1.0', 'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      actual = json.load(response)
                  assert actual == expected, 'Live JSON differs from repository fixture'
                  print('PASS: HTTPS fixture matches main; 3 articles; test_only=true')
                  break
              except (urllib.error.URLError, TimeoutError, ValueError, AssertionError) as exc:
                  print(f'Attempt {attempt}/6: {type(exc).__name__}: {exc}', flush=True)
                  if attempt == 6:
                      raise
                  time.sleep(20)
          PY
