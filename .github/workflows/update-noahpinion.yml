name: Refresh Noahpinion blog links
on:
  schedule:
    - cron: '13 */3 * * *'
  # Backfill the available RSS archive on deployment of parser changes.
  push:
    branches: [main]
    paths:
      - 'scripts/sync_blogs.py'
      - '.github/workflows/update-noahpinion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noahpinion-blogs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'fabian-stoeckl/fabian-stoeckl.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: blogs-live
          path: .blogs-live
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test feed parser
        run: python3 -m unittest discover -s tests -p test_noahpinion_feed.py -v
      - name: Refresh full available RSS history
        run: python3 scripts/sync_blogs.py --output .blogs-live/Privat/Pressespiegel/data/blogs.json
      - name: Update dedicated data branch only
        shell: bash
        run: |
          cd .blogs-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Privat/Pressespiegel/data/blogs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Noahpinion RSS history"
          git push origin HEAD:blogs-live
