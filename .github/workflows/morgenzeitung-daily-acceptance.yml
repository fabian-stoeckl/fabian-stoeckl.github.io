name: Morgenzeitung real-source and production acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/morgenzeitung_daily_acceptance.py'
      - 'tests/test_morgenzeitung_daily_acceptance.py'
      - '.github/workflows/morgenzeitung-daily-acceptance.yml'
  workflow_dispatch:
    inputs:
      date:
        description: 'Vienna edition date YYYY-MM-DD; blank means current date'
        required: false
        type: string
  schedule:
    # 12:15 UTC = 13:15 CET / 14:15 CEST, after 09:45 UTC private live audit.
    - cron: '15 12 * * *'
permissions:
  contents: read
concurrency:
  group: morgenzeitung-daily-acceptance
  cancel-in-progress: false
jobs:
  real-publisher-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression
        run: python3 -m unittest tests.test_morgenzeitung_daily_acceptance tests.test_morgenzeitung_publisher_date_evidence -v
      - name: Query real ORF, Standard, Presse and Handelsblatt article pages
        run: |
          mkdir -p /tmp/morgenzeitung-evidence
          python3 -m scripts.morgenzeitung_daily_acceptance --smoke --output /tmp/morgenzeitung-evidence/publisher-smoke.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/morgenzeitung-evidence/publisher-smoke.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write("### Real publisher article metadata: "+data['verdict']+"\\n")
              f.write("Matched: "+str(data['match_count'])+", inconclusive: "+str(data['inconclusive_count'])+"\\n")
              f.write("Access-restricted or metadata-free pages are inconclusive, never counted as verified.\\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-publisher-metadata-smoke
          path: /tmp/morgenzeitung-evidence/publisher-smoke.json
          if-no-files-found: warn
          retention-days: 30
  verify-and-archive-daily:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The production archive must run even when an unrelated smoke test fails.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual daily HTTPS and append immutable private report
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_DATE" ]; then
            python3 -m scripts.morgenzeitung_daily_acceptance --date "$REQUESTED_DATE"
          else
            python3 -m scripts.morgenzeitung_daily_acceptance
          fi
