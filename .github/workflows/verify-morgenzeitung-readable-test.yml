name: Verify readable Morgenzeitung test page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/tests/abschluss-2026-10-23.html'
      - '.github/workflows/verify-morgenzeitung-readable-test.yml'
permissions:
  contents: read
jobs:
  check-readable-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify live test page matches published source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, time, urllib.request, urllib.error
          path = 'Privat/Pressespiegel/tests/abschluss-2026-10-23.html'
          expected = pathlib.Path(path).read_bytes()
          assert expected.count(b'<article>') == 5
          url = 'https://www.fabian-stoeckl.com/' + path
          for attempt in range(1, 7):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent':'Morgenzeitung-Live-Check/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      assert response.status == 200
                      actual = response.read()
                  assert actual == expected, 'Public HTML differs from checked-out main'
                  assert b'ISOLIERTER ENDE-ZU-ENDE-TEST' in actual
                  print('PASS: HTTP 200, exact HTML match, 5 articles, clearly marked test')
                  break
              except (urllib.error.URLError, TimeoutError, AssertionError) as error:
                  print(f'Attempt {attempt}/6: {error}', flush=True)
                  if attempt == 6: raise
                  time.sleep(20)
          PY
