name: Verify site
on:
  push:
    paths:
      - .github/workflows/verify-etf-charts.yml
      - _config.yml
      - _layouts/**
      - assets/**
      - index.md
      - Privat/**
      - Gemfile
      - Gemfile.lock
      - package.json
      - package-lock.json
      - Privat/ETFs/index.html
      - scripts/update_etf_data.py
      - tests/**
  pull_request:
    paths:
      - .github/workflows/verify-etf-charts.yml
      - _config.yml
      - _layouts/**
      - assets/**
      - index.md
      - Privat/**
      - Gemfile
      - Gemfile.lock
      - package.json
      - package-lock.json
      - scripts/**
      - tests/**
permissions:
  contents: read
jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check FX mathematics and reference dates
        run: node tests/fx.test.cjs
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
      - run: npx playwright install --with-deps chromium
      - name: Check charts at mobile and desktop widths
        run: |
          node tests/charts.test.cjs
      - name: Check built preview and capture screenshots
        run: |
          bundle exec jekyll serve --no-watch --host 127.0.0.1 --port 4000 > /tmp/jekyll.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4000/ >/dev/null && break
            sleep 1
          done
          npm run check:preview
      - name: Upload pull-request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: |
            _site/
            artifacts/screenshots/
          retention-days: 14
