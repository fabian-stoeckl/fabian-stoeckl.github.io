name: Update ETF data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-etf-data.yml
      - scripts/update_etf_data.py
      - requirements-etf.txt
      - Privat/ETFs/etfs.json
  schedule:
    - cron: "37 21 * * 1-5"
    # Retry next morning, including Saturday for Friday closing prices.
    - cron: "37 6 * * 2-6"
    # Saturday at 12:15 Vienna time in summer, 11:15 in winter.
    - cron: "15 10 * * 6"
permissions:
  contents: write
  pages: write
concurrency:
  group: update-etf-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-etf.txt
      - name: Test freshness and failure handling
        run: python -m unittest discover -s tests -p "test_etf_update.py"
      - name: Fetch and validate market data
        id: fetch
        continue-on-error: true
        run: python scripts/update_etf_data.py
      - name: Commit data and rebuild GitHub Pages
        if: always() && steps.fetch.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Privat/ETFs/data/etf_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ETF performance data"
            git push
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          fi
      - name: Report stale or failed data fetch
        if: always() && steps.fetch.outcome == 'failure'
        run: |
          echo "Market data is incomplete or stale. Existing data was preserved; see warnings above."
          exit 1
