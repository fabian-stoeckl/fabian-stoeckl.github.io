name: Update ETF data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-etf-data.yml
      - scripts/update_etf_data.py
      - requirements-etf.txt
      - Privat/ETFs/etfs.json
  schedule:
    - cron: "15 18 * * 1-5"
    # Saturday at 12:15 Vienna time in summer, 11:15 in winter.
    - cron: "15 10 * * 6"
permissions:
  contents: write
  pages: write
concurrency:
  group: update-etf-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-etf.txt
      - run: python scripts/update_etf_data.py
      - name: Commit data and rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Privat/ETFs/data/etf_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ETF performance data"
            git push
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          fi
