name: Update ETF data
on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * 1-5"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-etf.txt
      - run: python scripts/update_etf_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Privat/ETFs/data/etf_data.json
          git diff --cached --quiet || (git commit -m "Update ETF performance data" && git push)
