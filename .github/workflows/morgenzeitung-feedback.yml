name: Morgenzeitung deterministic feedback
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write private profile after successful dry run'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/morgenzeitung-feedback.yml'
      - 'scripts/morgenzeitung_feedback.py'
      - 'tests/test_morgenzeitung_feedback.py'
  schedule:
    - cron: '15 5 * * *'
  # Daily run at 05:15 UTC; profile writes use explicit apply mode for scheduled events.
permissions:
  contents: read
jobs:
  feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p test_morgenzeitung_feedback.py -v
      - name: Require private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Configure MORGENZEITUNG_FEEDBACK_TOKEN with private repo Issues read and Contents read/write."
            exit 1
          fi
      - name: Read feedback, compute profile, write and verify privately
        env:
          GH_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
          APPLY_CHANGES: ${{ github.event_name == 'schedule' || inputs.apply == true }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/morgenzeitung
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, pathlib
          root='https://api.github.com/repos/fabian-stoeckl/morgenzeitung-feedback'
          token=os.environ['GH_TOKEN']
          def api(path, method='GET', body=None):
              req=urllib.request.Request(root+path,data=json.dumps(body).encode() if body is not None else None,method=method,
                headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          issues=[]
          page=1
          while True:
              batch=api(f'/issues?state=all&per_page=100&page={page}')
              issues.extend(i for i in batch if 'pull_request' not in i)
              if len(batch)<100:break
              page+=1
          # Include structured feedback revisions posted as issue comments.
          # Only the repository owner's comments may alter the private profile.
          for issue in issues:
              if not issue.get('comments') or not issue.get('title','').startswith('[Morgenzeitung] Sammelbewertung '):
                  continue
              comments=[]
              n=1
              while True:
                  batch=api(f"/issues/{issue['number']}/comments?per_page=100&page={n}")
                  comments.extend(batch)
                  if len(batch)<100:break
                  n+=1
              for comment in sorted(comments,key=lambda item:(item.get('created_at',''),item.get('id',0))):
                  if comment.get('user',{}).get('login')!='fabian-stoeckl':
                      continue
                  body=comment.get('body') or ''
                  if 'Artikel-ID:' not in body or 'Bewertung:' not in body:
                      continue
                  issue['body']=(issue.get('body') or '')+'\n\n'+body
                  issue['updated_at']=max(issue['updated_at'],comment.get('updated_at') or issue['updated_at'])
          p=api('/contents/profile.json')
          import base64
          original=json.loads(base64.b64decode(p['content']))
          d=pathlib.Path('/tmp/morgenzeitung')
          (d/'issues.json').write_text(json.dumps(issues))
          (d/'profile.json').write_text(json.dumps(original))
          subprocess.run(['python3','scripts/morgenzeitung_feedback.py','--profile',str(d/'profile.json'),
            '--issues',str(d/'issues.json'),'--editions','Privat/Pressespiegel/data',
            '--output',str(d/'next.json'),'--report',str(d/'report.json')],check=True)
          updated=json.loads((d/'next.json').read_text())
          report=json.loads((d/'report.json').read_text())
          # Publication metadata is recorded only after a verified live readback.
          # The public index alone is not evidence of successful deployment.
          # Always validate public publication, including dry runs.
          from urllib.parse import urljoin
          if True:
              public='https://www.fabian-stoeckl.com/Privat/Pressespiegel/data/'
              def public_json(name):
                  req=urllib.request.Request(urljoin(public,name),
                    headers={'User-Agent':'Morgenzeitung-publication-audit/1.0',
                             'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      return json.load(response)
              index=public_json('index.json')
              dates=index.get('dates',[])
              if not dates or not isinstance(dates,list):
                  raise ValueError('Empty or invalid public edition index')
              if dates:
                  newest=dates[0]
                  if not isinstance(newest,str) or not __import__('re').fullmatch(r'\d{4}-\d{2}-\d{2}',newest):
                      raise ValueError('Invalid public index date')
                  edition=public_json(newest+'.json')
                  if edition.get('date')!=newest:
                      raise ValueError('Live edition/index mismatch')
                  # Do not retroactively certify editorial impact or prior run completion.
                  print('Verified public edition:',newest,
                        'private last_successful_edition remains independent until S7 audit')
          if updated!=original and os.environ.get('APPLY_CHANGES')=='true':
              data=base64.b64encode((d/'next.json').read_bytes()).decode()
              api('/contents/profile.json','PUT',{'message':'Refresh deterministic feedback profile',
                'content':data,'sha':p['sha']})
          check=api('/contents/profile.json')
          expected=updated if os.environ.get('APPLY_CHANGES')=='true' else original
          assert json.loads(base64.b64decode(check['content']))==expected,'Private readback mismatch'
          print('Private feedback checked:',json.dumps(report),'applied:',os.environ.get('APPLY_CHANGES'))
          PY
