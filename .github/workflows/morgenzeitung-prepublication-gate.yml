name: Pressespiegel prepublication gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/data/**'
      - 'services/morgenzeitung-neu/**'
      - 'scripts/morgenzeitung_neu.py'
      - '.github/workflows/morgenzeitung-prepublication-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepublication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify current Pressespiegel edition structure and corrections
        run: python3 scripts/morgenzeitung_neu.py verify
