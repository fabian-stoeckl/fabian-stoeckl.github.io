name: Morgenzeitung prepublication gate
on:
  # Preserve the existing required check name for main branch protection.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Privat/Persoenliche-Zeitung/data/**'
      - 'scripts/morgenzeitung_v3_*.py'
      - '.github/workflows/morgenzeitung-prepublication-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepublication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate sole remaining Morgenzeitung 3 release contract
        run: |
          python3 -m unittest discover -s tests/morgenzeitung-v3 -v
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          root=pathlib.Path("Privat/Persoenliche-Zeitung/data")
          days=json.loads((root/"index.json").read_text(encoding="utf-8"))["dates"]
          assert days and days==sorted(set(days),reverse=True)
          for day in days:
              path=root/(day+".json")
              assert path.is_file()
              subprocess.run([sys.executable,"-m","scripts.morgenzeitung_v3_engine",
                  "verify","--edition",str(path)],check=True)
              subprocess.run([sys.executable,"-m","scripts.morgenzeitung_v3_release",
                  "verify","--edition",str(path)],check=True)
          print("PASS: V3 only; no publisher URL probes or legacy V1/V2 duties")
          PY
