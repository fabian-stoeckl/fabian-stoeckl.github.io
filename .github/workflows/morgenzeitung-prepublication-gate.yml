name: Morgenzeitung prepublication gate
on:
  # Always emit the required status for every PR. Path-filtered required checks
  # stay pending on unrelated PRs and can deadlock branch protection.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/data/*.json'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to verify (YYYY-MM-DD)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepublication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run publication gate regression tests
        run: |
          python3 -m unittest tests.test_morgenzeitung_prepublication_gate tests.test_morgenzeitung_live_source_check tests.test_morgenzeitung_publisher_date_evidence tests.test_morgenzeitung_source_evidence tests.test_morgenzeitung_official_mirror tests.test_morgenzeitung_publisher_feed tests.test_morgenzeitung_source_policy tests.test_morgenzeitung_gate_workflow_coverage
      - name: One-off independent preflight of private unarchived v2 research
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/morgenzeitung-v2-preflight-20261026'
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          token = os.environ.get("MORGENZEITUNG_FEEDBACK_TOKEN")
          if not token:
              raise SystemExit("Missing private repository token")
          url = "https://api.github.com/repos/fabian-stoeckl/morgenzeitung-feedback/contents/staging/2026-10-26-v2-candidates.json?ref=15f9946ec43080fa1c33912c58ee8299e634cdd3"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              obj = json.load(response)
          pathlib.Path("/tmp/morgenzeitung-v2-staging.json").write_bytes(base64.b64decode(obj["content"]))
          print("Loaded staged private candidate pool for independent preflight")
          PY
          python3 -m scripts.morgenzeitung_source_preflight --candidates /tmp/morgenzeitung-v2-staging.json --date 2026-10-26 --minimum 15
      - name: Immutable v2 S4 capture only after independently passing preflight
        if: github.event_name == 'pull_request' && github.head_ref == 'audit/morgenzeitung-v2-preflight-20261026'
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m scripts.morgenzeitung_capture_preselection --date 2026-10-26 --snapshot-version v2 --candidates /tmp/morgenzeitung-v2-staging.json --limit 10 --max-per-source 4
          python3 -m scripts.morgenzeitung_capture_preselection --date 2026-10-26 --snapshot-version v2 --verify-existing
      - name: Replay private original selection against edition
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
          REQUESTED_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          if not os.environ.get('MORGENZEITUNG_FEEDBACK_TOKEN'):
              raise SystemExit('Missing private repo token: publication gate cannot pass')
          if os.environ.get('EVENT_NAME')=='pull_request':
              base=os.environ['BASE_SHA']
              changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
              editions=[pathlib.Path(p).stem for p in changed
                  if re.fullmatch(r'Privat/Pressespiegel/data/\d{4}-\d{2}-\d{2}\.json',p)]
              if 'Privat/Pressespiegel/data/index.json' in changed and not editions:
                  raise SystemExit('Index changed without a dated edition: manual review required')
              if not editions:
                  print('No edition JSON changed; no publication to gate')
                  raise SystemExit(0)
          elif os.environ.get('EVENT_NAME')=='push':
              before=os.environ.get('PUSH_BEFORE','')
              if not re.fullmatch(r'[0-9a-f]{40}',before) or before=='0'*40:
                  raise SystemExit('Cannot determine prior main commit for publication audit')
              changed=subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines()
              editions=[pathlib.Path(p).stem for p in changed
                  if re.fullmatch(r'Privat/Pressespiegel/data/\d{4}-\d{2}-\d{2}\.json',p)]
              if 'Privat/Pressespiegel/data/index.json' in changed and not editions:
                  raise SystemExit('Index changed without a dated edition')
              if not editions:
                  print('No dated edition changed on main; no publication to audit')
                  raise SystemExit(0)
              print('POST-PUBLICATION AUDIT ONLY: this cannot prevent a direct main push')
          else:
              editions=[os.environ['REQUESTED_DATE']]
          for day in sorted(set(editions)):
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',day):
                  raise SystemExit('Invalid edition date')
              subprocess.run(['python3','-m','scripts.morgenzeitung_prepublication_gate',
                  '--date',day,'--edition','Privat/Pressespiegel/data/'+day+'.json',
                  '--index','Privat/Pressespiegel/data/index.json',
                  '--check-live-sources'],check=True)
          PY
