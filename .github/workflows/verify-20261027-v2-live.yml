name: Verify 27 Oct v2 actual HTTPS deployment
on:
  push:
    branches: ['verification/2026-10-27-v2-live']
    paths: ['.github/workflows/verify-20261027-v2-live.yml']
permissions:
  contents: read
jobs:
  independent-https-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm actual public HTTPS v2, index, UI, 15+19 and preserved feedback identities
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const base='https://www.fabian-stoeckl.com/Privat/Pressespiegel/';
          const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function get(path){
            const url=base+path+(path.includes('?')?'&':'?')+'v2readback='+Date.now();
            const response=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(15000),
              cache:'no-store',headers:{'Cache-Control':'no-cache','User-Agent':'Morgenzeitung-Independent-HTTPS-v2/1.0'}});
            assert.equal(response.status,200,path+' HTTP '+response.status);
            return response.text();
          }
          let last;
          for(let attempt=1;attempt<=20;attempt++){
            try{
              const [indexText,editionText,html,js]=await Promise.all([
                get('data/index.json'),get('data/2026-10-27.json'),get(''),get('app.js')]);
              const index=JSON.parse(indexText),e=JSON.parse(editionText);
              assert.equal(index.dates[0],'2026-10-27','public index date');
              assert.equal(e.date,'2026-10-27');
              assert.equal(e.snapshot_version,'v2','Pages not yet on rerun edition');
              assert.equal(e.articles.length,15);
              assert.equal(e.headlines.length,19);
              assert.equal(e.new_sources[0].name,'Le Monde');
              assert(html.includes('id="new-sources"'),'New-source section not on public HTML');
              assert(js.includes('discovery.hidden=trials.length===0'),'New-source UI script not deployed');
              const features=new Set(e.articles.map(a=>a.id)),news=new Set(e.headlines.map(a=>a.id));
              for(const id of ['27a0000000000003','27a000000000000d','27a0000000000002',
                  '27a0000000000005','27a0000000000007','27a0000000000008',
                  '27a000000000000a','27a0000000000001','27a000000000000b','27a000000000000f'])
                assert(features.has(id),'Previously rated feature lost: '+id);
              for(const id of ['27b0000000000001','27b0000000000002','27b0000000000003',
                  '27b0000000000004','27b0000000000006','27b0000000000007',
                  '27b0000000000008','27b0000000000009','27b000000000000a',
                  '27b000000000000b','27b000000000000c','27b000000000000d',
                  '27b000000000000e','27b000000000000f','27b0000000000010',
                  '27b0000000000013'])assert(news.has(id),'Previously rated headline lost: '+id);
              console.log('HTTPS_V2_READBACK_PASS',JSON.stringify({
                date:e.date,version:e.snapshot_version,features:e.articles.length,
                headlines:e.headlines.length,new_sources:e.new_sources.map(x=>x.name),
                original_rated_ids_preserved:true,index_latest:index.dates[0],
                public_url:base+'data/2026-10-27.json',attempt}));
              process.exit(0);
            }catch(error){
              last=error;console.log('HTTPS_V2_PENDING',attempt,error.message);
              if(attempt<20)await pause(15000);
            }
          }
          throw Error('HTTPS_V2_READBACK_FAIL after 20 attempts: '+last.message);
          JS
