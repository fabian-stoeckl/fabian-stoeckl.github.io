name: Verify published Morgenzeitung
on:
  pull_request:
    paths:
      - tests/pressespiegel-live.cjs
      - .github/workflows/verify-live-morgenzeitung.yml
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/**'
      - 'tests/pressespiegel-live.cjs'
      - '.github/workflows/verify-live-morgenzeitung.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-https-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm public HTML, direct-feedback JS and demo content via HTTPS
        run: node tests/pressespiegel-live.cjs
