name: Verify Pressespiegel
on:
  pull_request:
    paths: ['Privat/Pressespiegel/**','services/pressespiegel/**','scripts/pressespiegel.py','tests/pressespiegel/**','tests/pressespiegel-browser.cjs','.github/workflows/verify-pressespiegel.yml']
  push:
    branches: [main]
    paths: ['Privat/Pressespiegel/**','services/pressespiegel/**','scripts/pressespiegel.py','tests/pressespiegel/**','tests/pressespiegel-browser.cjs','.github/workflows/verify-pressespiegel.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m unittest discover -s tests/pressespiegel -v
      - run: python3 scripts/pressespiegel.py verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Reader and feedback in browser
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:8766/Privat/Pressespiegel/ >/dev/null && break
            sleep 1
          done
          node tests/pressespiegel-browser.cjs
