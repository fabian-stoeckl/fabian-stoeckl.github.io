name: Verify Morgenzeitung
on:
  pull_request:
    paths: ['Privat/Pressespiegel/**', 'services/morgenzeitung/**', 'tests/pressespiegel/**', 'tests/pressespiegel-github*', 'tests/pressespiegel-direct*', 'scripts/check_morgenzeitung.py', '.github/workflows/morgenzeitung-feedback.yml', '.github/workflows/verify-pressespiegel.yml']
  push:
    paths: ['Privat/Pressespiegel/**', 'services/morgenzeitung/**', 'tests/pressespiegel/**', 'tests/pressespiegel-github*', '.github/workflows/verify-pressespiegel.yml']
concurrency:
  group: verify-morgenzeitung-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  private-api-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/pressespiegel-github.test.cjs
      - run: node tests/pressespiegel-direct.test.cjs
      - run: python3 -m unittest discover -s tests/pressespiegel -v
      - run: python3 scripts/check_morgenzeitung.py
      - name: Install Chromium without slow system-package mutation
        run: timeout 240s npx playwright install chromium
      - name: Static GitHub preview (no API calls or feedback submissions)
        run: |
          python3 -m http.server 8765 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/Privat/Pressespiegel/config.json >/dev/null && break
            sleep 1
          done
          node tests/pressespiegel-github-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: morgenzeitung-preview
          path: artifacts/screenshots/morgenzeitung-*.png
          retention-days: 14

  rerun-independent-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check genuine 27 Oct v2 candidate pool from private repository
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json
          from scripts.morgenzeitung_capture_preselection import PrivateRepo
          from scripts.morgenzeitung_source_preflight import preflight
          repo=PrivateRepo(os.environ.get('MORGENZEITUNG_FEEDBACK_TOKEN'))
          entry=repo.read('research/drafts/2026-10-27-v2-preflight-r1.json')
          if entry is None: raise SystemExit('BLOCKED: draft missing')
          result=preflight(json.loads(entry[0]),'2026-10-27',minimum=15)
          print('SOURCE PREFLIGHT',json.dumps(result,ensure_ascii=False),flush=True)
          if not result['preflight_passed']:
              raise SystemExit('PARTIAL: curate and recheck source pool before S4')
          print('PASS: all candidate originals independently checked')
          PY
