name: Morgenzeitung 26 Oct v7 preflight and independent gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/morgenzeitung-v7-gate.yml'
      - 'Privat/Pressespiegel/data/2026-10-26.json'
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/data/2026-10-26.json'
permissions:
  contents: read
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preflight of genuine private unarchived candidate pool
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os
          from scripts.morgenzeitung_capture_preselection import PrivateRepo
          from scripts.morgenzeitung_source_preflight import preflight
          token=os.getenv('MORGENZEITUNG_FEEDBACK_TOKEN')
          if not token: raise SystemExit('FAIL: private token unavailable to CI')
          repo=PrivateRepo(token)
          raw=repo.read('research/drafts/2026-10-26-v7-preflight.json')
          if raw is None: raise SystemExit('FAIL: missing unarchived candidate draft')
          pool=json.loads(raw[0])
          if len(pool)<15: raise SystemExit('FAIL: fewer than 15 candidates')
          result=preflight(pool,'2026-10-26',minimum=15)
          print(json.dumps(result,ensure_ascii=False))
          if not result['preflight_passed']: raise SystemExit('FAIL: original publisher preflight')
          print('PASS: 15+ candidate originals verified; eligible for immutable v7 capture')
          PY
      - name: Verify S4 snapshot and live edition after archival
        if: hashFiles('Privat/Pressespiegel/data/2026-10-26.json') != ''
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
        run: |
          python3 -m unittest discover -s tests/pressespiegel -p test_v7_release.py -v
          python3 - <<'PY'
          import json,pathlib,os
          from scripts.morgenzeitung_capture_preselection import PrivateRepo
          from scripts.morgenzeitung_prepublication_gate import verify_edition
          from scripts.morgenzeitung_source_preflight import preflight
          edition=json.loads(pathlib.Path('Privat/Pressespiegel/data/2026-10-26.json').read_text())
          if edition.get('snapshot_version')!='v7':
              print('Existing edition is not v7; archival gate deferred')
          else:
              repo=PrivateRepo(os.environ['MORGENZEITUNG_FEEDBACK_TOKEN'])
              result=verify_edition(repo,'2026-10-26',edition,check_live=True)
              e=result.get('live_source_evidence') or {}
              print('REPLAY',json.dumps({'verified':result['prepublication_gate_verified'],'sources':e.get('source_verification_status')},ensure_ascii=False))
              if not result['prepublication_gate_verified'] or e.get('source_verification_status')!='PASS':
                  raise SystemExit('FAIL: private replay or independent originals')
              headlines=[dict(x,source_url=x['url'],verified=True,topic='Heute wichtig') for x in edition['headlines']]
              h=preflight(headlines,'2026-10-26',minimum=15)
              print('HEADLINE SOURCES',json.dumps({'ready':h['ready_count'],'blocked':h['blocked']},ensure_ascii=False))
              if not h['preflight_passed']: raise SystemExit('FAIL: 15 headline originals')
              print('PASS: all 25 edition originals independently checked')
          PY
