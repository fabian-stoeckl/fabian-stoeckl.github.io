name: Morgenzeitung v5 independent research preview gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/previews/2026-10-26-v5.*'
      - '.github/workflows/morgenzeitung-preview-v5-gate.yml'
  push:
    branches: [main]
    paths:
      - 'Privat/Pressespiegel/previews/2026-10-26-v5.*'
permissions:
  contents: read
jobs:
  v5-independent-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline schema, dates, isolation and non-overwrite checks
        run: python3 -m unittest discover -s tests/pressespiegel -p test_v5_preview.py -v
      - name: Independent private S4 replay and original publisher preflight
        env:
          MORGENZEITUNG_FEEDBACK_TOKEN: ${{ secrets.MORGENZEITUNG_FEEDBACK_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          from scripts.check_morgenzeitung import validate
          from scripts.morgenzeitung_capture_preselection import PrivateRepo
          from scripts.morgenzeitung_prepublication_gate import verify_edition
          from scripts.morgenzeitung_source_preflight import preflight
          edition=json.loads(pathlib.Path('Privat/Pressespiegel/previews/2026-10-26-v5.json').read_text())
          assert edition['preview'] is True and edition['snapshot_version']=='v5'
          assert len(edition['articles'])==10 and len(edition['headlines'])==15
          validate(edition)
          if not os.getenv('MORGENZEITUNG_FEEDBACK_TOKEN'):
              raise SystemExit('FAIL: missing private token')
          repo=PrivateRepo(os.environ['MORGENZEITUNG_FEEDBACK_TOKEN'])
          report=verify_edition(repo,'2026-10-26',dict(edition,preview=False),check_live=True)
          evidence=report.get('live_source_evidence') or {}
          print('PRIVATE S4 REPLAY:',json.dumps({'verified':report['prepublication_gate_verified'],'source_status':evidence.get('source_verification_status'),'inconclusive':evidence.get('inconclusive_count')},ensure_ascii=False))
          if not evidence.get('live_source_checks_passed') or evidence.get('source_verification_status')!='PASS':
              raise SystemExit('FAIL: not all 10 feature originals independently confirmed')
          headlines=[dict(item,source_url=item['url'],verified=True,topic='Heute wichtig') for item in edition['headlines']]
          h=preflight(headlines,'2026-10-26',minimum=15)
          print('HEADLINE PREFLIGHT:',json.dumps({'ready':h['ready_count'],'blocked':h['blocked_count'],'details':h['blocked']},ensure_ascii=False))
          if not h['preflight_passed']:
              raise SystemExit('FAIL: not all 15 headline originals independently confirmed')
          print('PASS: v5 private replay and all 25 original sources')
          PY
      - name: Verify deployed v5 HTTPS preview after main push
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import json,pathlib,time,urllib.request
          base='https://www.fabian-stoeckl.com/Privat/Pressespiegel/'
          local=json.loads(pathlib.Path('Privat/Pressespiegel/previews/2026-10-26-v5.json').read_text())
          def fetch(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'Morgenzeitung-v5-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=200: raise RuntimeError('HTTP '+str(r.status))
                  return r.read().decode('utf-8')
          for attempt in range(24):
              try:
                  live=json.loads(fetch('previews/2026-10-26-v5.json'))
                  html=fetch('previews/2026-10-26-v5.html')
                  index=json.loads(fetch('data/index.json'))
                  original=json.loads(fetch('data/2026-10-26.json'))
                  for section in ('headlines','articles'):
                      if [x['id'] for x in live[section]]!=[x['id'] for x in local[section]]:
                          raise ValueError('ordered '+section+' differs')
                  if live.get('preview') is not True or live.get('snapshot_version')!='v5':
                      raise ValueError('wrong preview marker')
                  if index['dates'][0]!='2026-10-26' or original.get('snapshot_version')!='v2':
                      raise ValueError('original changed')
                  if 'Morgenzeitung – Testausgabe' not in html or '2026-10-26-v5.json' not in html:
                      raise ValueError('HTML not deployed')
                  print('HTTPS PASS: v5 preview 10+15, untouched original v2 and index')
                  break
              except Exception as exc:
                  print('Waiting for Pages '+str(attempt+1)+'/24: '+str(exc))
                  if attempt==23: raise
                  time.sleep(15)
          PY
