name: Morgenzeitung recovery tests
on:
  pull_request:
    paths:
      - 'scripts/morgenzeitung_recovery_planner.py'
      - 'scripts/test_morgenzeitung_recovery_planner.py'
      - '.github/workflows/morgenzeitung-recovery-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/morgenzeitung_recovery_planner.py'
      - 'scripts/test_morgenzeitung_recovery_planner.py'
      - '.github/workflows/morgenzeitung-recovery-tests.yml'
permissions:
  contents: read
jobs:
  recovery-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic recovery regression tests
        run: |
          python3 -m unittest scripts.test_morgenzeitung_recovery_planner -v
          python3 -m unittest tests.test_morgenzeitung_live_source_check tests.test_morgenzeitung_publisher_date_evidence tests.test_morgenzeitung_source_evidence tests.test_morgenzeitung_official_mirror tests.test_morgenzeitung_publisher_feed tests.test_morgenzeitung_source_policy tests.test_morgenzeitung_prepublication_gate -v
