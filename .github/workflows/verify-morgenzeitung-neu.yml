name: Verify Pressespiegel (aktuell)
on:
  pull_request:
    paths: ['Privat/Pressespiegel/**', 'Privat/index.html', 'services/morgenzeitung-neu/**', 'scripts/morgenzeitung_neu.py', 'scripts/check_pressespiegel_live.py', 'scripts/pressespiegel_quality_report.py', 'tests/test_pressespiegel_readback.py', 'tests/test_pressespiegel_quality_report.py', 'tests/morgenzeitung-neu*', '.github/workflows/verify-morgenzeitung-neu.yml']
  push:
    branches: [main]
    paths: ['Privat/Pressespiegel/**', 'Privat/index.html', 'services/morgenzeitung-neu/**', 'scripts/morgenzeitung_neu.py', 'scripts/check_pressespiegel_live.py', 'scripts/pressespiegel_quality_report.py', 'tests/test_pressespiegel_readback.py', 'tests/test_pressespiegel_quality_report.py', 'tests/morgenzeitung-neu*', '.github/workflows/verify-morgenzeitung-neu.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/morgenzeitung_neu.py verify
      - run: python3 tests/morgenzeitung-neu-editorial.py
      - name: Check source-diversity advisory within editorial sections
        run: python3 -m unittest discover -s tests -p test_pressespiegel_quality_report.py -v
      - name: Regression-test public readback logic (offline)
        run: python3 -m unittest discover -s tests -p test_pressespiegel_readback.py -v
      - name: Document editorial source/evidence distribution
        run: python3 scripts/pressespiegel_quality_report.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: node tests/morgenzeitung-neu.test.cjs
      - run: node tests/morgenzeitung-neu-feedback.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Classic reader and independent preference page on mobile and desktop
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --silent --fail http://127.0.0.1:8766/Privat/Pressespiegel/ >/dev/null && break
            sleep 1
          done
          node tests/morgenzeitung-neu-browser.cjs
          node tests/morgenzeitung-neu-resilience.cjs

  live-readback:
    name: Verify deployed public reader and edition
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify live GitHub Pages output
        run: python3 scripts/check_pressespiegel_live.py --attempts 16 --delay 20
